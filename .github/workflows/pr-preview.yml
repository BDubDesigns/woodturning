# Deploys every pull request to its own preview URL and comments the link on the PR:
#   https://<owner>.github.io/<repo>/pr-preview/pr-<number>/
# The preview is removed when the PR is closed. Uses the gh-pages branch, like pages.yml.
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # Forks get a read-only token, so they cannot publish previews.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 20
      - name: Build the single-file game
        if: github.event.action != 'closed'
        run: |
          mkdir _site
          cp index.html _site/
          node tools/build.mjs _site/lathe.html
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
