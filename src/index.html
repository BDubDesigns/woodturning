<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Woodturning Lathe</title>
    <!-- Dev entry: open this file directly. `node tools/build.mjs` inlines
         everything into one self-contained lathe.html for sharing. -->
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="title-block">
          <div class="title">THE <em>LATHE</em></div>
          <div class="subtitle">PROTOTYPE 02 · SPINNING BLANK · REAL PROFILE CUTTING</div>
        </div>
        <div class="stats">
          <div class="stat">
            <div class="v" id="statRemoved">0<small>%</small></div>
            <div class="k">WOOD REMOVED</div>
          </div>
          <div class="stat">
            <div class="v" id="statDepth">0.0<small> mm</small></div>
            <div class="k">CUT DEPTH HERE</div>
          </div>
          <div class="stat hide-sm">
            <div class="v" id="statShape">Blank</div>
            <div class="k">SILHOUETTE</div>
          </div>
        </div>
      </header>

      <div id="stage">
        <div id="err"></div>
        <div id="cutflash"></div>
        <div id="pmeter" aria-hidden="true"><i></i></div>
        <div id="hint"><b>Touch below the log, then nudge up</b> to push the chisel in. Push harder to cut deeper.<br />Slow and steady cuts deep. Whip across fast and you only score the surface.</div>
      </div>

      <div id="profileBar">
        <div class="plabel">PROFILE</div>
        <canvas id="profileCanvas" aria-label="Live cross-section profile of the workpiece"></canvas>
      </div>

      <footer>
        <div class="tip-group" role="group" aria-label="Chisel tip">
          <button class="tip-btn" id="tipGouge" aria-pressed="true">
            <svg width="34" height="30" viewBox="0 0 34 30" aria-hidden="true">
              <path d="M4 4 h26 v10 c0 7 -6 12 -13 12 c-7 0 -13 -5 -13 -12 z" fill="none" stroke="#e8a33d" stroke-width="2.4"/>
              <path d="M9 9 v5 c0 4.4 3.6 8 8 8 c4.4 0 8 -3.6 8 -8 v-5" fill="none" stroke="#e8a33d" stroke-width="1.6" opacity="0.55"/>
            </svg>
            <span><span class="tname">GOUGE</span><div class="tdesc">Wide, rounded scoop · roughing &amp; curves</div></span>
          </button>
          <button class="tip-btn" id="tipSkew" aria-pressed="false">
            <svg width="34" height="30" viewBox="0 0 34 30" aria-hidden="true">
              <path d="M6 22 L28 6 v16 L6 26 z" fill="none" stroke="#e8a33d" stroke-width="2.4" stroke-linejoin="round"/>
              <path d="M10 22.6 L28 10" fill="none" stroke="#e8a33d" stroke-width="1.6" opacity="0.55"/>
            </svg>
            <span><span class="tname">SKEW</span><div class="tdesc">Narrow, angled flat · crisp grooves &amp; beads</div></span>
          </button>
        </div>
        <div class="side-controls">
          <div class="speed">
            <label for="rpm">SPEED</label>
            <input type="range" id="rpm" min="200" max="2400" step="50" value="1100" />
            <span class="rpmv" id="rpmVal">1100 RPM</span>
          </div>
          <button class="ctl-btn" id="viewBtn" title="Switch between 3D and flat view">2D VIEW</button>
          <button class="ctl-btn" id="soundBtn" aria-pressed="true" title="Toggle sound">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path class="snd-waves" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="snd-waves" d="M18.5 5.5a9.4 9.4 0 0 1 0 13"/></svg>
            SOUND
          </button>
          <button class="ctl-btn" id="newLogBtn" title="Mount a fresh blank">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
            NEW LOG
          </button>
        </div>
      </footer>
    </div>

    <script src="vendor/three.min.js"></script>
    <script src="js/cutting.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/view3d.js"></script>
    <script src="js/view2d.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
